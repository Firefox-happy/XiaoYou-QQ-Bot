<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小柚 · 设置台</title>
<style>
:root{
  --bg:#0b0c14; --bg2:#12141f; --card:#171a27; --line:#252a3d;
  --pink:#ff6fae; --cyan:#4fe3d0; --purple:#9d7bff;
  --text:#e8eaf2; --dim:#8b90a8; --dim2:#616680;
  --ok:#4fe3d0; --warn:#ffb347; --bad:#ff5c7a;
  --navtop:104px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; padding-bottom:110px;
}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(180deg,rgba(11,12,20,.98),rgba(11,12,20,.88));
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:14px 22px 12px;
}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand em{font-style:normal;color:var(--pink)}
.sub{color:var(--dim);font-size:12.5px}
.spacer{flex:1}
.banner{
  margin-top:10px; padding:9px 13px; border-radius:9px; font-size:12.5px;
  background:rgba(79,227,208,.08); border:1px solid rgba(79,227,208,.28); color:#bfeee6;
}
.banner.preview{background:rgba(157,123,255,.1);border-color:rgba(157,123,255,.35);color:#d9ccff}
.banner b{color:#fff}

/* ---------- 布局：左侧目录 + 右侧内容 ---------- */
.shell{
  display:flex; align-items:flex-start; gap:20px;
  max-width:1340px; margin:0 auto; padding:18px 22px 0;
}
.wrap{flex:1; min-width:0}

/* ---------- 左侧目录 ---------- */
.sidenav{
  position:sticky; top:var(--navtop); z-index:20; flex:none; width:218px;
  max-height:calc(100vh - var(--navtop) - 26px); overflow-y:auto;
  background:var(--card); border:1px solid var(--line); border-radius:13px;
  padding:10px 8px 9px;
}
.sidenav::-webkit-scrollbar{width:7px}
.sidenav::-webkit-scrollbar-thumb{background:#2c3145;border-radius:4px}
.navhead{
  display:flex; align-items:center; gap:6px;
  padding:1px 9px 8px; color:var(--dim2); font-size:11.5px;
}
.navhead b{color:var(--dim); font-weight:600}
.navhead span{margin-left:auto; font-variant-numeric:tabular-nums}
.navlist{display:flex; flex-direction:column; gap:1px}
.navitem{
  display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:8px;
  border:1px solid transparent; color:var(--dim); text-decoration:none;
  font-size:12.8px; line-height:1.35; cursor:pointer; transition:.13s;
}
.navitem:hover{background:rgba(255,255,255,.04); color:var(--text)}
.navitem.on{
  background:linear-gradient(90deg,rgba(255,111,174,.17),rgba(157,123,255,.07));
  border-color:rgba(255,111,174,.36); color:#fff;
}
.navitem .ni{flex:none; width:17px; text-align:center; font-size:13px}
.navitem .nt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.navitem .nc{flex:none; font-size:10.5px; color:var(--dim2); font-variant-numeric:tabular-nums}
.navitem .nc.hit{color:var(--pink); font-weight:700}
.navfoot{
  margin-top:9px; padding:8px 9px 1px; border-top:1px solid var(--line);
  color:var(--dim2); font-size:11px; line-height:1.75;
}
.navfoot kbd{
  background:var(--bg2); border:1px solid var(--line); border-radius:4px;
  padding:0 4px; font-family:inherit; font-size:10.5px; color:var(--dim);
}

/* ---------- 状态 ---------- */
.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;cursor:default;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.chip.ok   .dot{background:var(--ok);box-shadow:0 0 8px rgba(79,227,208,.6)}
.chip.warn .dot{background:var(--warn);box-shadow:0 0 8px rgba(255,179,71,.6)}
.chip.bad  .dot{background:var(--bad);box-shadow:0 0 8px rgba(255,92,122,.6)}
.chip.off  .dot{background:var(--dim2)}
.chip .lb{color:var(--dim)}
.chip .tx{color:var(--text)}
.chip .tx.ok{color:var(--ok)} .chip .tx.bad{color:var(--bad)}
.detail{
  margin:0 0 14px;padding:11px 14px;border-radius:9px;background:var(--bg2);
  border:1px solid var(--line);color:var(--dim);font-size:12.5px;white-space:pre-wrap;display:none
}
.detail.show{display:block}

/* ---------- 工具行 ---------- */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search],.txt{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 11px;font-size:13px;outline:none;
  font-family:inherit;
}
input[type=search]:focus,.txt:focus{border-color:var(--pink)}
input[type=search]{flex:1;min-width:190px}
.hits{color:var(--dim2);font-size:12px;margin-left:auto;white-space:nowrap}
.btn{
  background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:.15s;
}
.btn:hover{border-color:var(--dim2);background:#1d2132}
.btn.p{background:linear-gradient(135deg,var(--pink),#e1549a);border-color:transparent;color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11.5px}
.toggle{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--pink);width:15px;height:15px;cursor:pointer}

/* ---------- 分组卡 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:16px;overflow:hidden;scroll-margin-top:calc(var(--navtop) + 16px);
}
.card > h2{
  margin:0;padding:13px 17px;font-size:14px;font-weight:650;
  display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  background:linear-gradient(90deg,rgba(255,111,174,.09),rgba(157,123,255,.05) 45%,transparent);
  border-bottom:1px solid var(--line);transition:.14s;
}
.card > h2:hover{filter:brightness(1.1)}
.card > h2:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.card > h2 .chev{
  flex:none;width:11px;font-size:10px;color:var(--dim2);
  transition:transform .18s ease;
}
.card:not(.collapsed) > h2 .chev{transform:rotate(90deg)}
.card > h2 .cnt{margin-left:auto;color:var(--dim2);font-size:11.5px;font-weight:400;white-space:nowrap}
.card > h2 .cnt b{color:var(--pink);font-weight:700}
.card > h2 .grp-desc{color:var(--dim);font-size:12px;font-weight:400}
.card.collapsed > h2{border-bottom:0}
.card.collapsed table{display:none}

table{width:100%;border-collapse:collapse}
tr{border-top:1px solid rgba(37,42,61,.6)}
tr:first-child{border-top:0}
tr:hover{background:rgba(255,255,255,.017)}
tr.dirty{background:rgba(255,111,174,.055);box-shadow:inset 3px 0 var(--pink)}
tr.hide{display:none}
td{padding:11px 17px;vertical-align:middle}

td.k{width:44%}
.kname{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kdesc{color:var(--dim);font-size:12px;margin-top:2px}
.kpath{color:var(--dim2);margin-top:3px;opacity:.7;font-size:11px}

td.v{width:40%}
td.d{width:16%;text-align:right;white-space:nowrap}

.tag{
  display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;
  border:1px solid var(--line);color:var(--dim);background:var(--bg2);
}
.tag.secret{border-color:rgba(255,92,122,.45);color:#ff9fb2}
.tag.adv{border-color:rgba(157,123,255,.45);color:#c3aeff}

.def{color:var(--dim2);font-size:11.5px}
.def b{color:var(--dim);font-weight:600}
.rev{
  margin-left:8px;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:inherit;
}
.rev:hover{border-color:var(--pink);color:var(--pink)}

/* ---------- 控件 ---------- */
.sw{position:relative;display:inline-block;width:46px;height:25px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{
  position:absolute;inset:0;background:#2c3145;border-radius:999px;
  transition:.2s;cursor:pointer;border:1px solid var(--line);
}
.sw i:before{
  content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;
  background:#8b90a8;border-radius:50%;transition:.2s;
}
.sw input:checked + i{background:linear-gradient(135deg,var(--pink),#e1549a);border-color:transparent}
.sw input:checked + i:before{transform:translateX(21px);background:#fff}
.sw input:focus-visible + i{outline:2px solid var(--purple);outline-offset:2px}

input[type=number],input[type=time],select,textarea{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:13px;outline:none;
  font-family:inherit;width:100%;max-width:100%;
}
input[type=number]{width:110px}
input[type=time]{width:118px}
select{cursor:pointer;width:auto;min-width:150px}
textarea{resize:vertical;min-height:34px;line-height:1.5;font-size:12.5px}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
input.bad,textarea.bad,select.bad{border-color:var(--bad)!important}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .unit{color:var(--dim2);font-size:11.5px}
.row label.mini{color:var(--dim2);font-size:11.5px}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
  background:#2c3145;outline:none;width:100%;max-width:150px;flex:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),#e1549a);cursor:pointer;
  border:2px solid #fff2;box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.eyebtn{
  background:var(--bg2);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:14px;
}
.eyebtn:hover{border-color:var(--pink);color:var(--pink)}
.err{color:var(--bad);font-size:11.5px;margin-top:4px}

/* ---------- 底部保存条 ---------- */
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(0deg,rgba(11,12,20,.99),rgba(11,12,20,.9));
  border-top:1px solid var(--line);padding:12px 22px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  transform:translateY(100%);transition:transform .22s ease;
}
.savebar.up{transform:translateY(0)}
.savebar .msg{font-size:13px;color:var(--dim)}
.savebar .msg b{color:var(--pink);font-size:14px}
.savebar .spacer{flex:1}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);
  background:var(--card);border:1px solid var(--line);color:var(--text);
  padding:11px 18px;border-radius:11px;font-size:13px;z-index:60;
  box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:.22s;max-width:80vw;white-space:pre-wrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(79,227,208,.5)}
.toast.err{border-color:rgba(255,92,122,.55)}
.toast b{color:var(--pink)}

/* ---------- 空态 ---------- */
.empty{padding:40px;text-align:center;color:var(--dim2)}

/* ---------- 窄屏：目录变成横向条 ---------- */
@media(max-width:1080px){
  .shell{display:block; padding:12px 14px 0}
  .sidenav{
    position:relative; top:auto; z-index:1; width:auto; max-height:none;
    overflow:visible; border-radius:12px; padding:8px; margin-bottom:14px;
  }
  .navhead,.navfoot{display:none}
  .navlist{flex-direction:row; gap:6px; overflow-x:auto; padding-bottom:2px}
  .navitem{
    flex:none; gap:6px; padding:5px 10px; border-radius:999px;
    background:var(--bg2); border-color:var(--line);
  }
  .navitem .ni{width:auto}
  .navitem .nt{flex:none; max-width:9em}
  .navitem .nc{display:none}
}
@media(max-width:760px){
  td.k,td.v,td.d{width:100%;display:block;text-align:left;padding:8px 16px}
  td.k{padding-top:13px;padding-bottom:0}
  td.v{padding-top:7px} td.d{padding-bottom:12px}
  .topbar{padding:12px 14px}
  input[type=number]{width:100%}
  .hits{margin-left:0}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topline">
    <div>
      <div class="brand">小柚 · <em>设置台</em></div>
      <div class="sub" id="subline">所有能调的东西都在这张表上</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnReload">重新读取</button>
    <button class="btn" id="btnResetAll">恢复默认</button>
  </div>
  <div class="banner" id="banner">
    左边目录点一下直达分组，点分组标题可以收起 —— 改完点右下角 <b>保存</b>，再点 <b>保存并重启</b> 才会生效。
  </div>
</div>

<div class="shell">
  <aside class="sidenav" id="sidenav">
    <div class="navhead"><b>设置目录</b><span id="navTotal"></span></div>
    <nav class="navlist" id="navlist"></nav>
    <div class="navfoot">
      搜索框按 <kbd>/</kbd> 聚焦，<kbd>Esc</kbd> 清空。<br>
      <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存改动。
    </div>
  </aside>

  <div class="wrap">
    <div class="status" id="status"></div>
    <div class="detail mono" id="detail"></div>

    <div class="tools">
      <input type="search" id="q" placeholder="搜索设置项（名称 / 说明 / 键名）">
      <label class="toggle"><input type="checkbox" id="onlyDirty"> 只看改动</label>
      <label class="toggle" title="端口地址、心跳阈值这类基础设施项，平时不用看"><input type="checkbox" id="hideAdv"> 隐藏高级</label>
      <button class="btn sm" id="btnFold">全部收起</button>
      <span class="hits" id="hits"></span>
    </div>

    <main id="groups"></main>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="msg" id="saveMsg">没有改动</div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnDiscard">放弃改动</button>
  <button class="btn" id="btnSave">保存</button>
  <button class="btn p" id="btnSaveRestart">保存并重启</button>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const SCHEMA  = __SCHEMA_JSON__;
const GROUPS  = __GROUPS_JSON__;
const VALUES  = __VALUES_JSON__;
const HINTS   = __HINTS_JSON__;
const STATUS  = __STATUS_JSON__;
const SNAPSHOT = __SNAPSHOT__;
const TOKEN    = __TOKEN__;

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

const state = { values: {}, edited: {}, errors: {} };
const BY_PATH = {};
SCHEMA.forEach(it => { BY_PATH[it.path] = it; });

/* ---------------- 界面状态（折叠记忆） ---------------- */
const UI_KEY = "xy.settings.ui.v1";
const DEFAULT_OPEN = ["llm", "reply"];          // 默认只展开前两组，其余收起
let ui = { collapsed: {}, hideAdv: false };
try{
  const raw = localStorage.getItem(UI_KEY);
  if (raw){
    const o = JSON.parse(raw);
    if (o && typeof o === "object" && o.collapsed && typeof o.collapsed === "object")
      ui.collapsed = o.collapsed;
    if (o && typeof o === "object") ui.hideAdv = !!o.hideAdv;
  }
}catch(e){ /* file:// 或隐私模式下拿不到 localStorage，忽略即可 */ }
function saveUI(){
  try{ localStorage.setItem(UI_KEY, JSON.stringify({ collapsed: ui.collapsed, hideAdv: !!ui.hideAdv })); }catch(e){}
}
function hasOwn(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
function hasEdited(p){ return hasOwn(state.edited, p); }
function isCollapsed(gid){
  if (hasOwn(ui.collapsed, gid)) return !!ui.collapsed[gid];
  return DEFAULT_OPEN.indexOf(gid) < 0;
}
function advHidden(){ return !!ui.hideAdv; }        // "隐藏高级"开关（藏在功能后面的端口/阈值）

/* ---------------- 小工具 ---------------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function getPath(obj, path){
  return path.split(".").reduce((o,k) => (o == null ? undefined : o[k]), obj);
}
function deepEq(a, b){
  if (a === b) return true;
  if (Array.isArray(a) && Array.isArray(b))
    return a.length === b.length && a.every((x,i) => deepEq(x, b[i]));
  return false;
}
function cur(path){                       // 当前生效值（优先改动）
  return Object.prototype.hasOwnProperty.call(state.edited, path)
    ? state.edited[path] : getPath(state.values, path);
}
function fmtShort(v, item){
  if (v === undefined || v === null) return "—";
  switch (item.type){
    case "bool":  return v ? "开" : "关";
    case "list":  return Array.isArray(v) ? (v.length ? v.length + " 项" : "空") : String(v);
    case "pair":
    case "timerange": return Array.isArray(v) ? v.join(" ~ ") : String(v);
    default: return String(v) + (item.unit ? " " + item.unit : "");
  }
}
let toastTimer = null;
function toast(msg, kind){
  const el = $("#toast");
  el.className = "toast show " + (kind || "");
  el.innerHTML = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast " + (kind || ""); }, 3600);
}

/* ---------------- 左侧目录 ---------------- */
const NAV = {};                 // gid -> {a, badge}
let CARDS = {};                 // gid -> 分组卡元素
let navBox = null;
let activeGid = "";
let spyLock = 0;

function buildNav(){
  navBox = $("#sidenav");
  const list = $("#navlist");
  list.innerHTML = "";
  GROUPS.forEach(g => {
    const a = document.createElement("a");
    a.className = "navitem";
    a.href = "#g-" + g.id;
    a.dataset.g = g.id;
    a.innerHTML = '<span class="ni">' + esc(g.icon || "•") + "</span>" +
                  '<span class="nt">' + esc(g.title) + "</span>" +
                  '<span class="nc"></span>';
    a.onclick = ev => { ev.preventDefault(); jumpTo(g.id); };
    list.appendChild(a);
    NAV[g.id] = { a: a, badge: a.querySelector(".nc") };
  });
  $("#navTotal").textContent = GROUPS.length + " 组 · " + SCHEMA.length + " 项";
}

function lockSpy(ms){ spyLock = Date.now() + ms; }

function setActive(gid){
  if (activeGid === gid) return;
  activeGid = gid;
  Object.keys(NAV).forEach(k => NAV[k].a.classList.toggle("on", k === gid));
  const n = NAV[gid];
  if (n && navBox && navBox.scrollHeight > navBox.clientHeight + 4){
    const top = n.a.offsetTop, bot = top + n.a.offsetHeight;
    if (top < navBox.scrollTop + 34) navBox.scrollTop = Math.max(0, top - 44);
    else if (bot > navBox.scrollTop + navBox.clientHeight - 6)
      navBox.scrollTop = bot - navBox.clientHeight + 14;
  }
}

function jumpTo(gid){
  const card = CARDS[gid];
  if (!card) return;
  if (card.classList.contains("collapsed")){
    ui.collapsed[gid] = false;
    saveUI();
    applyCollapse();
  }
  lockSpy(800);
  setActive(gid);
  card.scrollIntoView({ block: "start", behavior: "smooth" });
}

function updateSpy(){
  if (Date.now() < spyLock) return;
  let cur = "";
  GROUPS.forEach(g => {
    const c = CARDS[g.id];
    if (!c || c.style.display === "none") return;
    if (c.getBoundingClientRect().top <= 160) cur = g.id;
  });
  if (!cur){
    for (let i = 0; i < GROUPS.length; i++){
      const c = CARDS[GROUPS[i].id];
      if (c && c.style.display !== "none"){ cur = GROUPS[i].id; break; }
    }
  }
  if (cur) setActive(cur);
}

/* ---------------- 折叠 ---------------- */
function forceOpen(){ return !!($("#q").value || "").trim() || $("#onlyDirty").checked; }

function applyCollapse(){
  const force = forceOpen();
  let anyOpen = false;
  GROUPS.forEach(g => {
    const c = CARDS[g.id];
    if (!c) return;
    if (!isCollapsed(g.id)) anyOpen = true;
    const col = !force && isCollapsed(g.id);
    c.classList.toggle("collapsed", col);
    const h = c.querySelector("h2");
    if (h) h.setAttribute("aria-expanded", col ? "false" : "true");
  });
  $("#btnFold").textContent = anyOpen ? "全部收起" : "全部展开";
}

function toggleGroup(gid){
  ui.collapsed[gid] = !isCollapsed(gid);
  saveUI();
  applyCollapse();
}

function matchItem(item, q){
  if (!q) return true;
  const hay = (item.name + " " + item.desc + " " + item.path + " " + (item.hint || "")).toLowerCase();
  return hay.indexOf(q) >= 0;
}
/* 搜索框 / 只看改动 / 隐藏高级 —— 三个筛选项各自的"这一项要不要露脸" */
function itemShown(item, q, onlyDirty){
  if (advHidden() && item.advanced) return false;
  if (!matchItem(item, q)) return false;
  if (onlyDirty && !hasEdited(item.path)) return false;
  return true;
}
function filtersOn(q){ return !!(q || $("#onlyDirty").checked || advHidden()); }

/* ---------------- 状态条 ---------------- */
function renderStatus(){

  box.innerHTML = "";
  (STATUS.items || []).forEach(it => {

    d.className = "chip " + (it.state || "off");

/* ---------------- 服务控制 ---------------- */
async function serviceAction(action, btn){
  if (SNAPSHOT){ toast("这是静态预览，请双击 <b>设置页.bat</b> 使用完整功能", "err"); return; }
  const names = {start:"启动", restart:"重启", stop:"停止", logs:"打开日志目录"};
  if ((action === "restart" || action === "stop") &&
      !confirm("确定要" + (names[action] || action) + "机器人吗？")) return;
  const old = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "处理中…"; }
  try{
    const r = await api("/api/service", { method:"POST", body:{ action } });
    if (action === "logs"){ toast("已打开日志目录", "ok"); return; }
    toast(r.ok ? (names[action] + "完成") : (names[action] + "失败"), r.ok ? "ok" : "err");
    if (r.output) { const p = $("#detail"); p.textContent = r.output; p.classList.add("show"); }
    await refreshStatus();
  }catch(e){
    toast("操作失败：" + e.message, "err");
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = old; }
  }
}

/* ---------------- 请求 ---------------- */
async function api(path, opts){
  opts = opts || {};
  const init = { method: opts.method || "GET", headers: { "X-Token": TOKEN } };
  if (opts.body !== undefined){
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, init);
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

/* ---------------- 控件 ---------------- */
function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

function makeControl(item){
  const wrap = el("div", "row");
  const value = cur(item.path);

  const emit = (v) => setEdited(item, v);

  if (item.type === "bool"){
    const sw = el("label", "sw");
    const inp = document.createElement("input");
    inp.type = "checkbox"; inp.checked = !!value;
    inp.onchange = () => emit(inp.checked);
    sw.appendChild(inp); sw.appendChild(el("i"));
    wrap.appendChild(sw);
    wrap.appendChild(el("span", "unit", inp.checked ? "开" : "关"));
    inp.addEventListener("change", () => {
      wrap.lastChild.textContent = inp.checked ? "开" : "关";
    });
    return wrap;
  }

  if (item.type === "int"){
    const inp = document.createElement("input");
    inp.type = "number";
    if (item.min != null) inp.min = item.min;
    if (item.max != null) inp.max = item.max;
    inp.step = item.step || 1;
    inp.value = value == null ? "" : value;
    inp.oninput = () => emit(inp.value === "" ? null : Number(inp.value));
    wrap.appendChild(inp);
    if (item.unit) wrap.appendChild(el("span", "unit", item.unit));
    return wrap;
  }

  if (item.type === "float"){
    const rng = document.createElement("input");
    rng.type = "range";
    rng.min = item.min != null ? item.min : 0;
    rng.max = item.max != null ? item.max : 1;
    rng.step = item.step || 0.05;
    rng.value = value == null ? rng.min : value;
    const num = document.createElement("input");
    num.type = "number";
    num.min = rng.min; num.max = rng.max; num.step = rng.step;
    num.value = rng.value;
    rng.oninput = () => { num.value = rng.value; emit(Number(rng.value)); };
    num.oninput = () => {
      if (num.value === "") return;
      const v = Number(num.value);
      if (!isNaN(v)) rng.value = v;
      emit(v);
    };
    wrap.appendChild(rng); wrap.appendChild(num);
    if (item.unit) wrap.appendChild(el("span", "unit", item.unit));
    return wrap;
  }

  if (item.type === "text"){
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "txt";
    inp.value = value == null ? "" : value;
    inp.style.width = "100%";
    inp.oninput = () => emit(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }

  if (item.type === "secret"){
    const inp = document.createElement("input");
    inp.type = "password"; inp.className = "txt";
    inp.style.flex = "1"; inp.autocomplete = "new-password";
    inp.placeholder = HINTS[item.path] ? "已设置：" + HINTS[item.path] + "（留空则不改）" : "未设置";
    inp.value = "";
    inp.oninput = () => emit(inp.value === "" ? null : inp.value);
    const eye = el("button", "eyebtn", "👁");
    eye.type = "button"; eye.title = "显示 / 隐藏";
    eye.onclick = () => { inp.type = inp.type === "password" ? "text" : "password"; };
    const rev = el("button", "eyebtn", "🔑");
    rev.type = "button"; rev.title = "查看现有值";
    rev.onclick = async () => {
      if (SNAPSHOT){ toast("这是静态预览，看不到真实密钥", "err"); return; }
      try{
        const r = await api("/api/reveal", { method:"POST", body:{ path: item.path } });
        if (!r.value){ toast("现在是空的，还没设置", "err"); return; }
        inp.value = r.value; inp.type = "text";
        inp.dispatchEvent(new Event("input"));
        toast("已填入现有值 —— <b>改完记得保存</b>", "ok");
      }catch(e){ toast("读不到：" + e.message, "err"); }
    };
    wrap.appendChild(inp); wrap.appendChild(eye); wrap.appendChild(rev);
    return wrap;
  }

  if (item.type === "select"){
    const sel = document.createElement("select");
    (item.options || []).forEach(o => {
      const op = document.createElement("option");
      op.value = o.v; op.textContent = o.t;
      if (String(value) === String(o.v)) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = () => emit(sel.value);
    wrap.appendChild(sel);
    return wrap;
  }

  if (item.type === "time"){
    const inp = document.createElement("input");
    inp.type = "time";
    inp.value = value == null ? "" : value;
    inp.oninput = () => emit(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }

  if (item.type === "list"){
    const ta = document.createElement("textarea");
    ta.rows = Math.min(6, Math.max(2, (Array.isArray(value) ? value.length : 1)));
    ta.placeholder = "一行一个";
    ta.value = Array.isArray(value) ? value.join("\n") : (value == null ? "" : String(value));
    ta.oninput = () => emit(ta.value.split("\n").map(s => s.trim()).filter(Boolean));
    wrap.appendChild(ta);
    return wrap;
  }

  if (item.type === "pair" || item.type === "timerange"){
    const vals = Array.isArray(value) ? value.slice() : (item.type === "pair" ? [0, 0] : ["", ""]);
    const labels = item.labels || ["前", "后"];
    const inputs = [];
    for (let i = 0; i < 2; i++){
      if (i) wrap.appendChild(el("span", "unit", "~"));
      const lb = el("label", "mini", esc(labels[i]));
      const inp = document.createElement("input");
      if (item.type === "timerange"){
        inp.type = "time"; inp.value = vals[i] == null ? "" : vals[i];
      } else {
        inp.type = "number";
        if (item.min != null) inp.min = item.min;
        if (item.max != null) inp.max = item.max;
        inp.step = item.step || 0.1;
        inp.style.width = "86px";
        inp.value = vals[i] == null ? "" : vals[i];
      }
      inputs.push(inp);
      const cell = el("span", "row");
      cell.style.gap = "5px";
      cell.appendChild(lb); cell.appendChild(inp);
      wrap.appendChild(cell);
    }
    const collect = () => {
      const out = inputs.map(inp => item.type === "timerange" ? inp.value : (inp.value === "" ? null : Number(inp.value)));
      emit(out);
    };
    inputs.forEach(inp => { inp.oninput = collect; });
    if (item.unit) wrap.appendChild(el("span", "unit", item.unit));
    return wrap;
  }

  wrap.appendChild(el("span", "unit", "（未知类型 " + esc(item.type) + "）"));
  return wrap;
}

/* ---------------- 改动标记 ---------------- */
/* td.d 里的「还原」是按 HTML 重新生成的，所以每次重写它都要重挂一次事件。
   漏挂的表现是：按钮画得出来、点下去毫无反应（曾经就是这样）。 */
function wireRev(tdD, item){
  const rev = $(".rev", tdD);
  if (!rev) return;
  rev.onclick = () => {
    delete state.edited[item.path];
    // 正在筛选（搜索 / 只看改动）时得整页重排，那一行可能会消失
    if (forceOpen()) render();
    else rebuildRow(item);
    refreshBar();
  };
}

function setEdited(item, v){
  const orig = getPath(state.values, item.path);
  const same = item.type === "secret" ? false : deepEq(v, orig);
  if (same) delete state.edited[item.path];
  else state.edited[item.path] = v;
  const tr = document.querySelector('tr[data-path="' + item.path + '"]');
  if (tr){
    tr.classList.toggle("dirty", Object.prototype.hasOwnProperty.call(state.edited, item.path));
    const d = $("td.d", tr);
    if (d){ d.innerHTML = defCellHTML(item); wireRev(d, item); }
    const gid = BY_PATH[item.path] && BY_PATH[item.path].group;
    const cnt = gid && CARDS[gid] ? CARDS[gid].querySelector(".cnt") : null;
    if (cnt) cnt.innerHTML = groupCountHTML(gid);
  }
  refreshBar();
  refreshNav();
}

function defCellHTML(item){
  const isDirty = Object.prototype.hasOwnProperty.call(state.edited, item.path);
  let h = '<div class="def">默认 <b>' + esc(fmtShort(item.default, item)) + "</b></div>";
  if (isDirty) h += '<button class="rev" type="button">还原</button>';
  return h;
}

function groupCountHTML(gid, shown){
  const items = SCHEMA.filter(it => it.group === gid);
  let n = 0;
  if (shown === undefined){
    const q = ($("#q").value || "").trim().toLowerCase();
    const onlyDirty = $("#onlyDirty").checked;
    items.forEach(it => { if (itemShown(it, q, onlyDirty)) n++; });
  } else n = shown;
  const dirtyN = items.filter(it => hasEdited(it.path)).length;
  let h = n + " / " + items.length + " 项";
  if (dirtyN) h += ' <b>改 ' + dirtyN + "</b>";
  return h;
}

function refreshNav(){
  const q = ($("#q").value || "").trim().toLowerCase();
  const onlyDirty = $("#onlyDirty").checked;
  const on = filtersOn(q);
  GROUPS.forEach(g => {
    const n = NAV[g.id];
    if (!n) return;
    const items = SCHEMA.filter(it => it.group === g.id);
    let shown = 0, dirtyN = 0;
    items.forEach(it => {
      const d = hasEdited(it.path);
      if (d) dirtyN++;
      if (itemShown(it, q, onlyDirty)) shown++;
    });
    n.a.style.display = (shown === 0 && on) ? "none" : "";
    if (dirtyN){ n.badge.textContent = "改" + dirtyN; n.badge.className = "nc hit"; }
    else { n.badge.textContent = String(on ? shown : items.length); n.badge.className = "nc"; }
  });
}

function refreshBar(){
  const n = Object.keys(state.edited).length;
  const bar = $("#savebar");
  bar.classList.toggle("up", n > 0 || SNAPSHOT);
  $("#btnSave").textContent = n ? ("保存 " + n + " 项") : "保存";
  $("#saveMsg").innerHTML = n ? ("有 <b>" + n + "</b> 项改动还没保存") : "没有改动";
}

/* ---------------- 渲染 ---------------- */
function render(){
  const host = $("#groups");
  host.innerHTML = "";
  CARDS = {};
  const q = ($("#q").value || "").trim().toLowerCase();
  const onlyDirty = $("#onlyDirty").checked;
  const on = filtersOn(q);
  let totalShown = 0, visibleCards = 0;

  GROUPS.forEach(g => {
    const items = SCHEMA.filter(it => it.group === g.id);
    const card = el("section", "card");
    card.id = "g-" + g.id;

    const h = el("h2");
    h.tabIndex = 0;
    h.setAttribute("aria-expanded", "true");
    h.innerHTML = '<span class="chev">▶</span><span>' + esc(g.icon || "") + "</span>" +
                  '<span class="gtitle">' + esc(g.title) + "</span>" +
                  '<span class="grp-desc">' + esc(g.desc || "") + "</span>" +
                  '<span class="cnt"></span>';
    h.onclick = () => toggleGroup(g.id);
    h.onkeydown = ev => {
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); toggleGroup(g.id); }
    };
    card.appendChild(h);

    const tb = document.createElement("table");
    let shown = 0;
    items.forEach(item => {
      const tr = document.createElement("tr");
      tr.dataset.path = item.path;
      const dirty = hasEdited(item.path);
      if (!itemShown(item, q, onlyDirty)) tr.classList.add("hide");
      if (!tr.classList.contains("hide")) shown++;
      if (dirty) tr.classList.add("dirty");

      const tags = [];
      if (item.secret) tags.push('<span class="tag secret">密钥</span>');
      if (item.advanced) tags.push('<span class="tag adv">高级</span>');

      const tdK = el("td", "k");
      tdK.innerHTML = '<div class="kname">' + esc(item.name) + tags.join("") + "</div>" +
                      '<div class="kdesc">' + esc(item.desc) + "</div>" +
                      '<div class="kpath mono">' + esc(item.path) +
                      (item.hint ? " · " + esc(item.hint) : "") + "</div>";
      tr.appendChild(tdK);

      const tdV = el("td", "v");
      tdV.appendChild(makeControl(item));
      tr.appendChild(tdV);

      const tdD = el("td", "d");
      tdD.innerHTML = defCellHTML(item);
      tr.appendChild(tdD);
      wireRev(tdD, item);

      tb.appendChild(tr);
    });

    h.querySelector(".cnt").innerHTML = groupCountHTML(g.id, shown);
    totalShown += shown;
    card.appendChild(tb);
    if (shown === 0 && on) card.style.display = "none";
    else visibleCards++;
    host.appendChild(card);
    CARDS[g.id] = card;
  });

  if (!visibleCards) host.appendChild(el("div", "empty", "没有匹配的设置项"));
  if (q || onlyDirty) $("#hits").textContent = "匹配 " + totalShown + " 项";
  else if (advHidden()) $("#hits").textContent = "显示 " + totalShown + " / " + SCHEMA.length + " 项 · 已隐藏高级";
  else $("#hits").textContent = "共 " + SCHEMA.length + " 项 · " + GROUPS.length + " 组";
  applyCollapse();
  refreshNav();
  updateSpy();
  syncNavTop();
}

function rebuildRow(item){
  const tr = document.querySelector('tr[data-path="' + item.path + '"]');
  if (!tr) return;
  const tdV = $("td.v", tr);
  tdV.innerHTML = "";
  tdV.appendChild(makeControl(item));
  const tdD = $("td.d", tr);
  tdD.innerHTML = defCellHTML(item);
  wireRev(tdD, item);
  tr.classList.toggle("dirty", hasEdited(item.path));
  const cnt = CARDS[item.group] ? CARDS[item.group].querySelector(".cnt") : null;
  if (cnt) cnt.innerHTML = groupCountHTML(item.group);
  refreshNav();
}

/* ---------------- 目录跟随滚动 ---------------- */
function syncNavTop(){
  const tb = document.querySelector(".topbar");
  if (!tb) return;
  document.documentElement.style.setProperty("--navtop", (tb.offsetHeight + 14) + "px");
}
let spyTick = false;
function onScroll(){
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; updateSpy(); });
}

/* ---------------- 保存 ---------------- */
async function save(restart){
  const n = Object.keys(state.edited).length;
  if (!n){ toast("没有改动", "err"); return; }
  if (SNAPSHOT){
    toast("这是静态预览文件，不能保存。<br>请双击项目根目录的 <b>设置页.bat</b>。", "err");
    return;
  }
  const btn = restart ? $("#btnSaveRestart") : $("#btnSave");
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    const r = await api("/api/save", { method:"POST", body:{ changes: state.edited } });
    if (!r.ok){
      const bad = Object.keys(r.errors || {});
      toast("<b>保存失败</b>：" + (bad.length ? bad.map(k => k + " " + r.errors[k]).join("；") : "校验不通过"), "err");
      return;
    }
    // 用提交过的值刷新本地基线；密钥不留明文在页面里
    Object.keys(state.edited).forEach(k => {
      const isSecret = BY_PATH[k] && BY_PATH[k].type === "secret";
      setByPath(state.values, k, isSecret ? null : state.edited[k]);
      if (isSecret && state.edited[k]) HINTS[k] = "已保存（点钥匙可查看）";
    });
    const cnt = Object.keys(state.edited).length;
    state.edited = {};
    render(); refreshBar();
    if (!restart){
      toast("已保存 <b>" + cnt + "</b> 项 —— 点「保存并重启」才会生效", "ok");
      return;
    }
    toast("已保存 <b>" + cnt + "</b> 项，正在重启机器人…", "ok");
    const sr = await api("/api/service", { method:"POST", body:{ action:"restart" } });
    if (sr.output){ const p = $("#detail"); p.textContent = sr.output; p.classList.add("show"); }
    toast(sr.ok ? "已保存并重启完成 ✅" : "保存成功，但重启失败（看下面的详情）", sr.ok ? "ok" : "err");
    await refreshStatus();
  }catch(e){
    toast("保存失败：" + e.message, "err");
  }finally{
    btn.disabled = false; btn.textContent = old;
    refreshBar();
  }
}

function setByPath(obj, path, v){
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++){
    if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = v;
}

/* ---------------- 状态刷新 ---------------- */
async function refreshStatus(){
  if (SNAPSHOT){ renderStatus(); return; }
  try{
    const r = await api("/api/status");
    STATUS.items = r.items || [];
    renderStatus();
  }catch(e){ /* 状态拿不到不影响改配置 */ }
}

/* ---------------- 启动 ---------------- */
async function boot(){
  buildNav();
  $("#hideAdv").checked = !!ui.hideAdv;      // 上次的选择记着，不用每次重勾
  if (SNAPSHOT){
    // 快照里 VALUES 是后端注入的真实配置 —— 不接上的话整张表全是空控件，
    // 看着像真的、其实一点数据都没有（这个洞藏了很久才被截图发现）。
    state.values = VALUES || {};
    $("#banner").className = "banner preview";
    $("#banner").innerHTML = "这是<b>静态预览</b>（只读快照，界面和数据取自你现在的 config.json）。" +
      "真正能保存的是项目根目录的 <b>设置页.bat</b>。";
    $("#subline").textContent = "预览模式 · 改动不会保存";
    $("#navTotal").textContent = GROUPS.length + " 组 · " + SCHEMA.length + " 项";
    render(); renderStatus(); refreshBar();
    return;
  }
  try{
    const cfg = await api("/api/config");
    state.values = cfg.values || {};
    Object.assign(HINTS, cfg.hints || {});
    render(); refreshBar();
    await refreshStatus();
  }catch(e){
    $("#banner").className = "banner preview";
    $("#banner").innerHTML = "读不到配置：" + esc(e.message) + " —— 请从 <b>设置页.bat</b> 打开。";
  }
}

$("#q").oninput = () => render();
$("#onlyDirty").onchange = () => render();
$("#hideAdv").onchange = () => { ui.hideAdv = $("#hideAdv").checked; saveUI(); render(); };
$("#btnFold").onclick = () => {
  const anyOpen = GROUPS.some(g => !isCollapsed(g.id));
  ui.collapsed = {};
  GROUPS.forEach(g => { ui.collapsed[g.id] = anyOpen; });
  saveUI();
  applyCollapse();
  toast(anyOpen ? "已收起全部分组" : "已展开全部分组", "ok");
};
$("#btnSave").onclick = () => save(false);
$("#btnSaveRestart").onclick = () => save(true);
$("#btnDiscard").onclick = () => {
  if (!Object.keys(state.edited).length) return;
  if (!confirm("放弃全部未保存的改动？")) return;
  state.edited = {}; render(); refreshBar(); toast("已放弃改动", "ok");
};
$("#btnReload").onclick = () => {
  if (Object.keys(state.edited).length && !confirm("有未保存的改动，重新读取会丢弃它们。继续？")) return;
  state.edited = {}; boot();
};
$("#btnResetAll").onclick = () => {
  if (!confirm("把所有设置项恢复成出厂默认值？\n（只影响你在页面上保存的项，保存后才生效）")) return;
  SCHEMA.forEach(item => {
    if (!deepEq(item.default, getPath(state.values, item.path))) state.edited[item.path] = item.default;
  });
  render(); refreshBar();
  toast("已填入默认值，点「保存」生效", "ok");
};
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", () => { syncNavTop(); updateSpy(); });
if (window.ResizeObserver){
  window.addEventListener("load", () => {
    const tb = document.querySelector(".topbar");
    if (tb) new ResizeObserver(syncNavTop).observe(tb);
    syncNavTop();
  });
}
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); save(false); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)){
    e.preventDefault(); $("#q").focus(); return;
  }
  if (e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; render(); $("#q").blur();
  }
});

boot();
</script>
</body>
</html>
